<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0A84FF" />
<title>StudyMate 学业管家</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#fff; --tint:#0A84FF; --text:#1C1C1E; --sub:#8E8E93; --sep:#E5E5EA;
    --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE; --teal:#5AC8FA; --yellow:#FFCC00;
    --navh:56px; --tabh:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
  }
  #app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.08)}
  /* 顶部导航 */
  .nav{
    height:var(--navh);display:flex;align-items:center;justify-content:center;
    background:rgba(249,249,249,.94);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--sep);font-weight:700;font-size:17px;flex:none;position:relative;z-index:5;
  }
  .nav .r{position:absolute;right:14px;font-size:13px;font-weight:500;color:var(--tint)}
  /* 内容区 */
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
  .content.pad{padding-bottom:24px}
  h1{font-size:28px;font-weight:800;margin:16px 0 12px}
  h2{font-size:19px;font-weight:700;margin:18px 0 8px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .row{display:flex;align-items:center}
  .grow{flex:1}
  .sub{color:var(--sub);font-size:13px}
  .muted{color:var(--sub)}
  button{font-family:inherit}
  .btn{
    background:var(--tint);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn.sm{padding:5px 11px;font-size:12px;border-radius:14px}
  .btn.ghost{background:var(--bg);color:var(--text)}
  .btn.danger{background:var(--red)}
  .btn.flat{background:var(--sep);color:var(--text)}
  .btn:active{opacity:.7}
  .tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;color:#fff;background:var(--sub);margin-right:6px}
  input,textarea,select{
    font-family:inherit;font-size:15px;background:var(--bg);border:1px solid var(--sep);border-radius:10px;
    padding:10px 12px;width:100%;outline:none;color:var(--text)
  }
  input:focus,textarea:focus{border-color:var(--tint)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  /* 统计卡片 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
  .stats .card{text-align:center;margin:0;padding:12px 6px}
  .stat-n{font-size:20px;font-weight:800}
  .stat-t{font-size:11px;color:var(--sub);margin-top:3px}
  /* 任务行 */
  .tr{display:flex;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
  .tr:last-child{border-bottom:none}
  .chk{width:22px;height:22px;border-radius:11px;border:2px solid var(--sep);margin-right:10px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .chk.on{background:var(--green);border-color:var(--green)}
  .tt{flex:1;font-size:15px}
  .tt.done{color:var(--sub);text-decoration:line-through}
  /* 底部 Tab */
  .tabbar{
    height:var(--tabh);display:flex;flex:none;
    background:rgba(249,249,249,.94);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px}
  .tab i{font-style:normal;font-size:21px;line-height:1;opacity:.55;transition:.15s}
  .tab span{font-size:10px;color:var(--sub)}
  .tab.on i{opacity:1}
  .tab.on span{color:var(--tint);font-weight:600}
  /* 番茄钟 */
  .pomo{text-align:center}
  .clock{font-size:52px;font-weight:200;letter-spacing:1px;margin:6px 0 12px;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
  /* 热力图 */
  .heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
  .heat .col{display:flex;flex-direction:column;gap:3px}
  .hc{width:12px;height:12px;border-radius:2px;background:var(--sep);flex:none}
  .legend{display:flex;align-items:center;gap:3px;margin-top:10px;font-size:11px;color:var(--sub)}
  /* 日历 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal .wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
  .cell{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;position:relative}
  .cell.sel{background:var(--tint);color:#fff}
  .cell.sel .dot{background:#fff}
  .cell.today{color:var(--tint);font-weight:700}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--orange);margin-top:3px}
  /* 分段控件 */
  .seg{display:flex;background:#E3E3E8;border-radius:10px;padding:3px;margin-bottom:14px}
  .seg div{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
  .seg div.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .bar{height:8px;background:var(--sep);border-radius:4px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:4px}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto}
  .sheet h3{margin:0 0 12px;font-size:18px}
  .pill{display:inline-block;padding:5px 11px;border-radius:14px;font-size:12px;font-weight:600;margin:0 6px 8px 0;cursor:pointer;background:var(--sep);color:var(--text)}
  .pill.on{color:#fff}
  .toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;
    padding:12px 20px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none
  }
  .toast.on{opacity:1}
  .kb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kb .btn{width:100%}
  /* 今日计划卡 */
  .hero{background:linear-gradient(135deg,#0A84FF,#5AC8FA);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
  .hero .ph{font-size:12px;opacity:.9;font-weight:600}
  .hero .ttl{font-size:19px;font-weight:800;margin:4px 0 8px}
  .hero .meta{font-size:12px;opacity:.92}
  .pbar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden;margin-top:10px}
  .pbar>i{display:block;height:100%;background:#fff;border-radius:3px}
  /* 周计划 */
  .phase{margin-bottom:10px}
  .phase .hd{display:flex;align-items:center;padding:12px 14px;background:#fff;border-radius:14px;cursor:pointer}
  .phase .hd .nm{font-weight:700;font-size:15px}
  .phase .hd .rg{font-size:12px;color:var(--sub);margin-top:2px}
  .phase .bd{background:#fff;border-radius:0 0 14px 14px;margin-top:-6px;padding:12px 14px 14px;border-top:1px solid var(--sep)}
  .wtask{display:flex;align-items:flex-start;padding:8px 0;border-bottom:.5px solid var(--sep)}
  .wtask:last-child{border-bottom:none}
  .wtask .dd{width:34px;flex:none;font-size:12px;color:var(--tint);font-weight:700;padding-top:2px}
  .wtask .tx{flex:1;font-size:14px;line-height:1.5}
  .today-hl{background:#FFF7E6;border-radius:8px;padding:2px 6px;font-weight:600}
  .ms{background:#EEF4FF;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#1C4E8A}
  .rescard{display:flex;align-items:flex-start;padding:10px 0;border-bottom:.5px solid var(--sep)}
  .rescard:last-child{border-bottom:none}
  .rescard .rn{font-weight:600;font-size:14px}
  .rescard .rp{font-size:12px;color:var(--tint);margin-top:2px}
  .rescard .rt{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
  .wchip{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;background:var(--sep);color:var(--text);margin:0 6px 6px 0;cursor:pointer}
  .wchip.on{background:var(--tint);color:#fff}
  .wchip.done{background:#D1F2DC;color:#1B7A3D}
</style>
</head>
<body>
<div id="app">
  <div class="nav"><span id="navTitle">今日</span><span class="r" id="navRight"></span></div>
  <div class="content" id="view"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="./plan-data.js"></script>
<script>
/* ============ 常量 ============ */
const KEY = 'studymate_web_v1';
const SUBJECTS = ['算法','英语','数据结构','Java','离散数学','408','汇编','概率论','竞赛','其他'];
const SUBCOLOR = {'算法':'#0A84FF','英语':'#FF3B30','数据结构':'#34C759','Java':'#FF9500','离散数学':'#AF52DE','408':'#5AC8FA','汇编':'#FFCC00','概率论':'#FF6482','竞赛':'#5856D6','其他':'#8E8E93'};
const WEEK = ['日','一','二','三','四','五','六'];
const TABS = [
  {key:'today', label:'今日', icon:'🏠'},
  {key:'plan',  label:'周计划', icon:'🗓'},
  {key:'cal',   label:'日历', icon:'📅'},
  {key:'goals', label:'目标', icon:'🎯'},
  {key:'heat',  label:'热力图', icon:'📈'},
  {key:'me',    label:'我的', icon:'👤'},
];

/* ============ 工具 ============ */
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }
function gpaPoint(s){
  if(s>=90) return 4.0; if(s>=85) return 3.7; if(s>=82) return 3.3; if(s>=78) return 3.0;
  if(s>=75) return 2.7; if(s>=72) return 2.3; if(s>=68) return 2.0; if(s>=64) return 1.5; if(s>=60) return 1.0; return 0;
}

/* ============ 种子数据（你的计划） ============ */
function seed(){
  const comps = [
    {id:'c1',name:'CET-6 六级考试',date:'2026-12-19',signup:'已报名',status:'备考中',result:''},
    {id:'c2',name:'蓝桥杯校内选拔/报名',date:'2026-11-15',signup:'待报名',status:'关注中',result:''},
    {id:'c3',name:'百度之星·程序设计大赛',date:'2026-12-01',signup:'待报名',status:'关注中',result:''},
    {id:'c4',name:'天梯赛校内选拔',date:'2026-12-10',signup:'待报名',status:'关注中',result:''},
    {id:'c5',name:'蓝桥杯省赛（B组）',date:'2027-04-10',signup:'待报名',status:'训练中',result:''},
    {id:'c6',name:'马蹄杯',date:'2027-04-20',signup:'待报名',status:'关注中',result:''},
    {id:'c7',name:'天梯赛全国总决赛',date:'2027-04-25',signup:'待报名',status:'关注中',result:''},
    {id:'c8',name:'华为软件精英挑战赛',date:'2027-04-30',signup:'待报名',status:'关注中',result:''},
  ];
  const courses = [
    {id:'g1',name:'Java 编程入门',credit:3,score:null},
    {id:'g2',name:'数据结构',credit:4,score:null},
    {id:'g3',name:'离散数学',credit:4,score:null},
    {id:'g4',name:'概率论与数理统计',credit:3,score:null},
    {id:'g5',name:'汇编语言程序设计',credit:3,score:null},
    {id:'g6',name:'中级英语读写',credit:2,score:null},
    {id:'g7',name:'跨文化交流英语',credit:2,score:null},
    {id:'g8',name:'人工智能数学基础',credit:2,score:null},
  ];
  const roadmap = [
    {stage:'大二（现在）',goals:['过 CET-6','蓝桥杯拿省奖','天梯赛参与','数据结构/离散学扎实','408 数据结构第一轮']},
    {stage:'大三上',goals:['408 系统一轮','数学建模校赛/国赛','六级刷分 500+','做一个完整项目（SpringBoot/小程序）']},
    {stage:'大三下',goals:['确定考研/保研/就业方向','ICPC/CCPC 冲刺','互联网+ / 挑战杯（A类加分）']},
    {stage:'大四',goals:['秋招 / 考研冲刺','毕设','奖状汇总进综测']},
  ];
  const tasks = [];
  for(let i=0;i<14;i++){
    const d = fmt(new Date(Date.now()+i*86400000));
    [{t:'背六级单词 30min（不背单词App）',s:'英语'},
     {t:'洛谷/力扣 刷题 1-2 道',s:'算法'},
     {t:'数据结构复习（王道视频）',s:'数据结构'},
     {t:'当日课程作业/预习',s:'其他'}].forEach((x,j)=>{
      tasks.push({id:`${d}_${j}`,date:d,title:x.t,subject:x.s,done:false});
    });
  }
  [{t:'报名/确认蓝桥杯校选拔信息',s:'竞赛'},
   {t:'力扣 hot100：数组 + 双指针',s:'408'},
   {t:'csdiy.wiki 浏览本学期课程资源',s:'其他'}].forEach((x,j)=>{
    tasks.push({id:`sp_${j}`,date:today(),title:x.t,subject:x.s,done:false});
  });
  return {tasks,comps,courses,roadmap,wrongs:[],pomos:[],settings:{remind:true}};
}

/* ============ 计划定位（按日期自动找到当前第几周 / 今天该做什么） ============ */
// 直接按每周的「实际起止日期」匹配，避免跨学期/寒假的推算误差
function parseWeekRange(w){
  // "10.12–10.18" -> {sm,sd,em,ed}
  const r = String(w.dateRange||'').replace(/[–—]/g,'-');
  const m = r.match(/(\d{1,2})\.(\d{1,2})\s*-\s*(\d{1,2})\.(\d{1,2})/);
  if(!m) return null;
  return {sm:+m[1],sd:+m[2],em:+m[3],ed:+m[4]};
}
// 学年横跨 2026-09 ~ 2027-05：9-12 月 = 2026，1-8 月 = 2027
function guessYear(month){ return month >= 9 ? 2026 : 2027; }
// 把某周转换为真实起止 Date
function weekStartDate(w){
  const rg = parseWeekRange(w); if(!rg) return null;
  return new Date(guessYear(rg.sm), rg.sm-1, rg.sd);
}
function weekEndDate(w){
  const rg = parseWeekRange(w); if(!rg) return null;
  return new Date(guessYear(rg.em), rg.em-1, rg.ed, 23,59,59);
}
// 核心：给定日期，落在哪一周（返回 PLAN_WEEKS 下标）
function planWeekIndex(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  if (isNaN(d)) return -1;
  for(let i=0;i<PLAN_WEEKS.length;i++){
    const s = weekStartDate(PLAN_WEEKS[i]), e = weekEndDate(PLAN_WEEKS[i]);
    if(s && e && d >= s && d <= e) return i;
  }
  return -1;
}
function planWeekOf(dateStr){
  const i = planWeekIndex(dateStr);
  return i >= 0 ? PLAN_WEEKS[i] : null;
}
// 今天在这一周里是第几天（0=周一 ... 6=周日），映射到 days 数组下标
function todayDayIndex(dateStr){
  const wd = new Date(dateStr + 'T12:00:00').getDay(); // 0=周日
  return wd === 0 ? 6 : wd - 1;
}
// 该周 7 个真实日期（周一起）
function weekDates(weekObj){
  const s = weekStartDate(weekObj);
  if(!s) return null;
  return Array.from({length:7}, (_,k)=> fmt(new Date(s.getTime() + k*86400000)));
}
// 阶段进度
function phaseProgress(){
  const idx = planWeekIndex(today());
  const total = PLAN_WEEKS.length;
  const done = idx < 0 ? (today() > fmt(weekStartDate(PLAN_WEEKS[total-1]||{})) ? total : 0) : idx;
  return { idx, total, done, pct: Math.min(100, Math.round(done/total*100)) };
}
function findPhase(name){
  return PLAN_PHASES.find(p => name && name.startsWith(p.name.split('｜')[0])) || null;
}

/* ============ 数据层 ============ */
let S = null;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
  catch(e){ S = seed(); }
  if(!S.settings) S.settings = {remind:true};
  if(!S.wrongs) S.wrongs = [];
  if(!S.pomos) S.pomos = [];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function persist(render=true){ save(); if(render) draw(); }

/* 业务方法 */
const api = {
  addTask(date,title,subject){ S.tasks.push({id:uid(),date,title,subject:subject||'其他',done:false}); persist(); },
  toggleTask(id){ const t=S.tasks.find(x=>x.id===id); if(t){t.done=!t.done; persist();} },
  delTask(id){ S.tasks=S.tasks.filter(x=>x.id!==id); persist(); },
  tasksOn(date){ return S.tasks.filter(t=>t.date===date); },
  addPomo(min,subject){ S.pomos.push({id:uid(),date:today(),minutes:min,subject,ts:Date.now()}); persist(); },
  saveComp(c){ if(c.id && S.comps.some(x=>x.id===c.id)) S.comps=S.comps.map(x=>x.id===c.id?c:x); else { c.id=uid(); S.comps.push(c);} persist(); },
  delComp(id){ S.comps=S.comps.filter(x=>x.id!==id); persist(); },
  saveCourse(c){ if(c.id && S.courses.some(x=>x.id===c.id)) S.courses=S.courses.map(x=>x.id===c.id?c:x); else { c.id=uid(); S.courses.push(c);} persist(); },
  delCourse(id){ S.courses=S.courses.filter(x=>x.id!==id); persist(); },
  saveWrong(w){ if(w.id && S.wrongs.some(x=>x.id===w.id)) S.wrongs=S.wrongs.map(x=>x.id===w.id?w:x); else { w.id=uid(); w.status=w.status||'未复习'; S.wrongs.push(w);} persist(); },
  delWrong(id){ S.wrongs=S.wrongs.filter(x=>x.id!==id); persist(); },
  gpa(){
    const g = S.courses.filter(c=>c.score!==null && c.score!=='' && !isNaN(c.score));
    if(!g.length) return {gpa:'0.00',avg:'0',credits:0};
    const cr = g.reduce((a,c)=>a+Number(c.credit||0),0) || 1;
    const gpa = g.reduce((a,c)=>a+gpaPoint(Number(c.score))*Number(c.credit||0),0)/cr;
    const avg = g.reduce((a,c)=>a+Number(c.score)*Number(c.credit||0),0)/cr;
    return {gpa:gpa.toFixed(2),avg:avg.toFixed(1),credits:cr};
  },
  streak(){
    const act = new Set([...S.pomos.map(p=>p.date), ...S.tasks.filter(t=>t.done).map(t=>t.date)]);
    let n=0,d=new Date();
    while(act.has(fmt(d))){ n++; d=new Date(d-86400000); }
    return n;
  },
  reset(){ S = seed(); persist(); },
};

/* ============ 全局 UI 状态 ============ */
const UI = {
  tab:'today',
  calSel: today(),
  goalsTab:0,
  meTab:0,
  planTab:0,
  planOpen:null,
  pomo:{ preset:25, left:0, running:false, subject:'算法', base:0 },
  pomoTimer:null,
};

/* ============ 视图 ============ */
function draw(){
  // 底部 tab
  $('tabbar').innerHTML = TABS.map(t=>`
    <div class="tab ${UI.tab===t.key?'on':''}" onclick="go('${t.key}')">
      <i>${t.icon}</i><span>${t.label}</span>
    </div>`).join('');
  // 顶部标题

  const p = UI.pomo;

  if(el) el.textContent = `${pad(Math.floor(Math.max(p.left,0)/60))}:${pad(Math.max(p.left,0)%60)}`;
  if(p.left<=0){

    toast(`🍅 完成 ${p.preset} 分钟（${p.subject}），休息一下！`);

/* ---------- 热力图 ---------- */
function renderHeat(v){
  const intensity = (date)=>{
    const p = S.pomos.filter(x=>x.date===date).reduce((a,x)=>a+x.minutes,0);
    const t = S.tasks.filter(x=>x.date===date&&x.done).length;
    const sc = p/25 + t;
    if(sc<=0) return null;
    if(sc<2) return 'var(--teal)';
    if(sc<4) return 'var(--tint)';
    if(sc<7) return '#0066CC';
    return '#003D7A';
  };
  const weeks=[];
  const now=new Date();
  const start=new Date(now.getTime()-364*86400000);
  start.setDate(start.getDate()-start.getDay());
  for(let w=0;w<53;w++){
    const col=[];
    for(let dd=0;dd<7;dd++) col.push(fmt(new Date(start.getTime()+(w*7+dd)*86400000)));
    weeks.push(col);
  }
  const activeDays = new Set([...S.pomos.map(p=>p.date),...S.tasks.filter(t=>t.done).map(t=>t.date)]).size;
  const totalMin = S.pomos.reduce((a,p)=>a+p.minutes,0);
  // 周报
  const weekRows = [0,1,2,3].map(i=>{
    const days = weeks[weeks.length-1-i] || [];
    const min = S.pomos.filter(p=>days.includes(p.date)).reduce((a,p)=>a+p.minutes,0);
    const ts = S.tasks.filter(t=>days.includes(t.date));
    const rate = ts.length? Math.round(ts.filter(t=>t.done).length/ts.length*100):0;
    return {i,min,rate};
  });
  v.innerHTML = `<h1>📈 热力图</h1>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="card"><div class="stat-n" style="color:var(--tint)">${activeDays}</div><div class="stat-t">累计学习天数</div></div>
      <div class="card"><div class="stat-n" style="color:var(--orange)">${(totalMin/60).toFixed(1)}h</div><div class="stat-t">累计专注时长</div></div>
    </div>
    <h2>近一年学习热力图</h2>
    <div class="card">
      <div class="heat">${weeks.map(col=>`<div class="col">${col.map(d=>{
        const c = intensity(d);
        const title = (d===today()? '今天（'+d+'）' : d);
        return `<div class="hc" style="background:${c||'var(--sep)'}" title="${title}"></div>`;
      }).join('')}</div>`).join('')}</div>
      <div class="legend">少
        ${['var(--sep)','var(--teal)','var(--tint)','#0066CC','#003D7A'].map(c=>`<span class="hc" style="background:${c}"></span>`).join('')}
      多</div>
    </div>
    <h2>每周学习报告</h2>
    <div class="card">
      ${weekRows.map(r=>`<div class="row" style="margin:8px 0">
        <div class="grow">近第 ${r.i+1} 周</div>
        <b style="color:var(--tint);width:56px;text-align:right">${(r.min/60).toFixed(1)}h</b>
        <b style="color:var(--green);width:70px;text-align:right">完成 ${r.rate}%</b>
      </div>`).join('')}
    </div>
    <h2>近 7 天明细</h2>
    <div class="card">
      ${Array.from({length:7}).map((_,k)=>{
        const d = fmt(new Date(Date.now()-(6-k)*86400000));
        const min = S.pomos.filter(p=>p.date===d).reduce((a,p)=>a+p.minutes,0);
        const ts = api.tasksOn(d), dn = ts.filter(t=>t.done).length;
        return `<div class="row" style="margin:7px 0">
          <div class="grow">${d.slice(5)} <span class="sub">周${WEEK[new Date(d+'T00:00:00').getDay()]}</span></div>
          <span class="sub" style="width:70px;text-align:right">${min} min</span>
          <span class="sub" style="width:70px;text-align:right">${dn}/${ts.length} 任务</span>
        </div>`;
      }).join('')}
    </div>`;
}

function scheduleDaily(){

  const now = new Date();
  const next = new Date(); next.setHours(h,m,0,0);
  if(next<=now) next.setDate(next.getDate()+1);
  window._rt = setTimeout(()=>{

      new Notification('📚 今日学习提醒', {body:'查看今日任务、背 30 分钟六级单词、刷 1-2 道算法题！'});

    scheduleDaily();
  }, next-now);
}

    <textarea id="imp" rows="6" placeholder='{"tasks":[...]}'></textarea>
    <div style="height:12px"></div>
    <button class="btn" style="width:100%" onclick="doImport()">导入并覆盖</button>
    <div style="height:8px"></div>
    <button class="btn flat" style="width:100%" onclick="doImportFile()">📁 选择文件导入</button>
    <input id="impFile" type="file" accept=".json,application/json" style="display:none" onchange="readImportFile(this)" />
    <div style="text-align:center;margin-top:12px" class="sub" onclick="closeSheet()">取消</div>`);
};
window.doImport = ()=>{
  try{
    const d = JSON.parse($('imp').value);
    if(!d.tasks) throw new Error('格式不正确');
    S = d; save(); closeSheet(); toast('导入成功'); draw();
  }catch(e){ toast('导入失败：'+e.message); }
};
window.doImportFile = ()=> $('impFile').click();
window.readImportFile = (el)=>{
  const f = el.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ $('imp').value = r.result; toast('已读取，点「导入并覆盖」'); };
  r.readAsText(f);
};
window.doReset = ()=>{ if(confirm('将清空所有记录并恢复示例数据，确定？')){ api.reset(); toast('已重置'); } };

/* ---------- 弹窗 ---------- */
function openSheet(html){ $('sheet').innerHTML = html; $('mask').classList.add('on'); }
function closeSheet(){ $('mask').classList.remove('on'); }
window.closeSheet = closeSheet;
$('mask').addEventListener('click', (e)=>{ if(e.target === $('mask')) closeSheet(); });

/* ============ 启动 ============ */
load();
draw();
if('Notification' in window && Notification.permission==='granted' && S.settings.remind) scheduleDaily();
// 跨天自动刷新
setInterval(()=>{ if(UI.tab==='today') draw(); }, 60000);
</script>
</body>
</html>
